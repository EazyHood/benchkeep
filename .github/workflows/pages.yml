name: Publish web preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CI: 'true'
      EXPO_NO_DOTENV: '1'
      EXPO_PUBLIC_REVENUECAT_MODE: production
      EXPO_PUBLIC_REVENUECAT_TEST_STORE_KEY: ''
      BENCHKEEP_WEB_BASE_URL: /benchkeep
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check types
        run: npm run typecheck
      - name: Run tests
        run: npm test
      - name: Export production preview
        run: npx expo export --platform web --output-dir dist-pages
      - name: Keep Expo asset paths intact
        run: touch dist-pages/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Read Pages configuration
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
